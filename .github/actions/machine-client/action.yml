name: Machine client prerequisite
description: Build the machine client used by TypeScript integration tests
runs:
  using: composite
  steps:
    # The release binary depends only on the Rust workspace and the machine
    # schema export its build.rs reads, so a PR that touches neither restores
    # the binary instead of paying the ~3 minute release build in every lane
    # that spawns it (machines, codemode, oniApp). No restore-keys: a stale
    # binary must never stand in for the one this commit describes.
    - id: mclient
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: clients/target/release/mclient
        key: mclient-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('clients/**', 'packages/protocol/schema/machine/**') }}
    - if: steps.mclient.outputs.cache-hit != 'true'
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
      with:
        toolchain: 1.98.0
        components: rustfmt, clippy, llvm-tools-preview
    - if: steps.mclient.outputs.cache-hit != 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: clients
    - if: steps.mclient.outputs.cache-hit != 'true'
      shell: bash
      working-directory: clients
      run: cargo build --release --locked -p oni-machine-client
    - shell: bash
      run: |
        test -x clients/target/release/mclient
        echo "ONI_MCLIENT_BIN=${{ github.workspace }}/clients/target/release/mclient" >> "$GITHUB_ENV"
