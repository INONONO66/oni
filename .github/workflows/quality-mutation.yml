name: quality-mutation

on:
  schedule:
    # Daily evidence: the initial weekly schedule had no runs as of 2026-09-09.
    # Each night resumes shard progress until every slice is complete.
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      pilot_limit:
        description: 'Diagnostic pilot candidate limit (0 runs the full campaign)'
        type: number
        default: 0
      pilot_target:
        description: 'Optional inventory path for a diagnostic pilot (requires pilot_limit > 0)'
        type: string
        default: ''
      shard_count:
        description: 'Number of execution shards for the full campaign'
        type: number
        default: 8
      shard_budget_minutes:
        description: 'Per-shard wall-clock budget in minutes before a clean partial stop. The runner clock starts before the runner''s own setup, baseline and reach selection (not the job''s checkout and build steps), so the budget covers them; the wrapper refuses values above 340 (the 360-minute job timeout minus a 10-minute allowance for the steps around the runner, minus a settle sized for compiler-worker disposal, re-verification and cleanup) and a candidate is dispatched only when its worst-case run still fits'
        type: number
        default: 240
      mutant_memory_mb:
        description: 'Linux address-space cap in MiB for each mutant test child (not baseline/reach selection)'
        type: number
        default: 6144
      fresh_progress:
        description: 'Ignore previous shard progress artifacts (restart the campaign)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: quality-mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan shard matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Emit deterministic shard list
        id: plan
        env:
          PILOT_LIMIT: ${{ inputs.pilot_limit || 0 }}
          SHARD_COUNT: ${{ inputs.shard_count || 8 }}
        run: |
          if [[ "$PILOT_LIMIT" != 0 ]]; then
            echo "count=1" >> "$GITHUB_OUTPUT"
            echo "shards=[0]" >> "$GITHUB_OUTPUT"
          else
            echo "count=$SHARD_COUNT" >> "$GITHUB_OUTPUT"
            echo "shards=[$(seq -s, 0 $((SHARD_COUNT - 1)))]" >> "$GITHUB_OUTPUT"
          fi
  mutation:
    name: Mutation campaign shard
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install manifest-pinned Bun and frozen workspace dependencies
        uses: ./.github/actions/setup
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Install frozen analyzer tools
        run: |
          python -m pip install --requirement script/conformance/quality-python-requirements.txt
          echo "D945_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
      - name: Build workspace declarations with the CI entry point
        run: bun run ci build
      - run: bun run script/check-quality-python.ts
      # The campaign baseline runs the whole suite, including the codemode
      # browser recipe tests, so every shard needs the prerequisites.
      - name: Browser prerequisites (codemode, #1275)
        uses: ./.github/actions/browser-prerequisites
      - name: Download previous shard progress
        if: ${{ (inputs.pilot_limit || 0) == 0 && inputs.fresh_progress != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: quality-mutation-progress-${{ needs.plan.outputs.count }}-${{ matrix.shard }}
        run: |
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT}&per_page=10" \
            --jq '[.artifacts[] | select(.expired == false)][0].workflow_run.id // empty')
          if [[ -n "$run_id" ]]; then
            gh run download "$run_id" --name "$ARTIFACT" --dir mutation-progress
            wc -l mutation-progress/* || true
          else
            echo "no previous progress artifact: fresh shard start"
          fi
      - name: Execute campaign shard and enforce measured baseline
        env:
          PILOT_LIMIT: ${{ inputs.pilot_limit || 0 }}
          PILOT_TARGET: ${{ inputs.pilot_target || '' }}
          SHARD_COUNT: ${{ needs.plan.outputs.count }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_BUDGET: ${{ inputs.shard_budget_minutes || 240 }}
          MUTANT_MEMORY_MB: ${{ inputs.mutant_memory_mb || 6144 }}
        run: |
          args=(--mutant-memory-mb "$MUTANT_MEMORY_MB")
          if [[ "$PILOT_LIMIT" != 0 ]]; then
            args+=(--pilot --limit "$PILOT_LIMIT")
          else
            mkdir -p mutation-progress
            args+=(--shard "$SHARD_INDEX" --shard-count "$SHARD_COUNT")
            args+=(--progress "mutation-progress/shard-${SHARD_COUNT}-${SHARD_INDEX}.jsonl")
            args+=(--budget-minutes "$SHARD_BUDGET")
          fi
          if [[ -n "$PILOT_TARGET" ]]; then
            args+=(--target "$PILOT_TARGET")
          fi
          while sleep 20; do
            echo "[mutation-resource] $(date -u +%FT%TZ)"
            free -m | sed -n 2p
            ps -o rss,cmd -C bun | sort -rn | head -3
            df -h / /tmp
          done &
          sampler=$!
          trap 'kill "$sampler"' EXIT
          /usr/bin/time -v bun run script/quality-native-mutation.ts "${args[@]}"
      - name: Preserve shard progress for the next scheduled run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-mutation-progress-${{ needs.plan.outputs.count }}-${{ matrix.shard }}
          path: mutation-progress/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve shard receipt for the join step
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-mutation-shard-${{ matrix.shard }}
          path: quality-mutation-results/
          if-no-files-found: error
          retention-days: 14
  join:
    name: Join shard receipts and enforce measured baseline
    needs: [plan, mutation]
    if: ${{ always() && needs.plan.result == 'success' && (inputs.pilot_limit || 0) == 0 }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install manifest-pinned Bun and frozen workspace dependencies
        uses: ./.github/actions/setup
      - name: Build workspace declarations with the CI entry point
        run: bun run ci build
      - name: Download shard receipts from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: quality-mutation-shard-*
          path: mutation-shards
      - name: Join complete shards into the single campaign receipt
        run: bun run script/quality-mutation-join.ts --shards mutation-shards
      - name: Preserve complete or failed campaign evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-mutation-receipt
          path: quality-mutation-results/
          if-no-files-found: error
          retention-days: 14
