name: Machine client prerequisite
description: Build the machine client used by TypeScript integration tests
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
      with:
        toolchain: 1.98.0
        components: rustfmt, clippy, llvm-tools-preview
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: clients
    - shell: bash
      working-directory: clients
      run: cargo build --release --locked -p oni-machine-client
    - shell: bash
      run: echo "ONI_MCLIENT_BIN=${{ github.workspace }}/clients/target/release/mclient" >> "$GITHUB_ENV"
