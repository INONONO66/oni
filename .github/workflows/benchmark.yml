name: Benchmark

# PR measurements are limited to benchmark inputs; main and scheduled runs stay full.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 0'
  pull_request:
    paths:
      - .github/workflows/benchmark.yml
      - script/benchmark-workflow.test.ts
      - packages/agent/**
      - packages/protocol/**
      - script/summarize-benchmark-runs.ts
      - script/check-benchmark-regression.ts
      - script/conformance/summarize-benchmark-runs.test.ts
      - script/check-benchmark-regression.test.ts
      - package.json
      - bun.lock
      - bunfig.toml
      - turbo.json
      - tsconfig.base.json
  workflow_dispatch:
    inputs:
      runs:
        description: Number of repeated benchmark runs to summarize
        required: false
        default: "5"
      accept_baseline:
        description: "Owner-approved baseline reset: accept regressions above the limit and publish the new reference"
        required: false
        default: "false"

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BENCHMARK_REGRESSION_PERCENT: "20"
      # The label/input is the Owner sign-off record; it never skips validation.
      BENCHMARK_ACCEPT_BASELINE: ${{ (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'benchmark:accept-baseline')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.accept_baseline == 'true') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
      - name: Validate benchmark input
        env:
          BENCHMARK_RUNS: ${{ github.event.inputs.runs || '5' }}
        run: |
          bun run script/summarize-benchmark-runs.ts --validate-input
          bun run script/check-benchmark-regression.ts --validate-input
      - run: bunx turbo run build --filter=@oni/protocol

      # Accepted history is data only. Both revisions use the head-pinned Bun,
      # but install their own frozen dependency graphs in separate worktrees.
      - name: Prepare accepted benchmark reference
        run: |
          set -euo pipefail
          REFERENCE_WORKTREE="$RUNNER_TEMP/benchmark-reference"
          printf 'REFERENCE_WORKTREE=%s\n' "$REFERENCE_WORKTREE" >> "$GITHUB_ENV"
          rm -rf bench-results
          mkdir -p bench-results
          git fetch --no-tags origin gh-pages
          git show FETCH_HEAD:dev/bench/data.js > bench-results/accepted.js
          reference_commit=$(bun run script/check-benchmark-regression.ts --accepted-commit bench-results/accepted.js)
          printf '%s\n' "$reference_commit" > bench-results/accepted-commit.txt
          git rev-parse HEAD > bench-results/head-commit.txt
          bun --version > bench-results/bun-version.txt
          uname -a > bench-results/runner.txt
          git fetch --no-tags origin "$reference_commit"
          git worktree add --detach "$REFERENCE_WORKTREE" "$reference_commit"
          (
            cd "$REFERENCE_WORKTREE"
            bun install --frozen-lockfile
            bunx turbo run build --filter=@oni/protocol
          )

      - name: Run repeated paired benchmarks
        env:
          BENCHMARK_RUNS: ${{ github.event.inputs.runs || '5' }}
        run: |
          set -euo pipefail
          measure() {
            local revision="$1" checkout="$2" output="$3"
            printf '%s\t%s\n' "$run" "$revision" >> "$GITHUB_WORKSPACE/bench-results/order.tsv"
            mkdir -p "$output"
            (
              cd "$checkout"
              rm -rf packages/*/bench-results
              # #1246 folded the ledger session benches into the agent package;
              # the paired reference checkout may predate the fold, so measure
              # whichever owner the checkout has. Benchmark names are unchanged.
              if [ -f packages/agent/bench/store.ts ]; then
                bun run --cwd packages/agent bench/store.ts
                cp packages/agent/bench-results/session.json "$output/session.json"
              else
                bun run --cwd packages/ledger bench
                cp packages/ledger/bench-results/session.json "$output/session.json"
              fi
              bun run --cwd packages/agent bench
              cp packages/agent/bench-results/agent.json "$output/agent.json"
            )
          }
          for run in $(seq 1 "$BENCHMARK_RUNS"); do
            if (( run % 2 )); then revisions=(reference head); else revisions=(head reference); fi
            for revision in "${revisions[@]}"; do
              if [[ "$revision" == reference ]]; then
                measure reference "$REFERENCE_WORKTREE" "$GITHUB_WORKSPACE/bench-results/reference/runs/$run"
              else
                measure head "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/bench-results/runs/$run"
              fi
            done
          done

      - name: Summarize benchmark runs
        env:
          BENCHMARK_RUNS: ${{ github.event.inputs.runs || '5' }}
        run: |
          set -euo pipefail
          bun run script/summarize-benchmark-runs.ts
          bun run script/summarize-benchmark-runs.ts --reference bench-results/reference/runs bench-results/reference/combined.json bench-results/reference/statistics.json bench-results/reference/summary.md

      - name: Publish benchmark summary
        run: cat bench-results/summary.md >> "$GITHUB_STEP_SUMMARY"

      # Sole admission decision for every event: one fresh reference means zero
      # historical noise band. PRs (including forks) never publish history.
      - name: Compare paired benchmarks
        run: |
          set -euo pipefail
          bun run script/check-benchmark-regression.ts --prepare-reference bench-results/reference/statistics.json bench-results/accepted.js "$(git -C "$REFERENCE_WORKTREE" rev-parse HEAD)" "$(git rev-parse HEAD)"
          bun run script/check-benchmark-regression.ts bench-results/statistics.json bench-results/reference.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-results
          path: bench-results/
          if-no-files-found: error
          retention-days: 14

  memory:
    name: Memory regression guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: bunx turbo run build --filter=@oni/protocol
      - run: bun test ./packages/agent/test/store/bench/memory-regression.bench.ts

  publish:
    name: Publish benchmark history
    needs: benchmark
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Download benchmark results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: benchmark-results
          path: bench-results

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: Oni Benchmarks
          tool: customSmallerIsBetter
          output-file-path: bench-results/combined.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          # Storage only: needs: benchmark already enforced the stricter paired
          # 20% gate. Cross-runner history must not make a second decision.
          summary-always: true
      - name: Publish accepted benchmark reference
        if: success()
        run: git push origin gh-pages:gh-pages
