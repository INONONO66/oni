name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  merge_group:
  schedule:
    - cron: '23 3 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: CI Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      class: ${{ steps.select.outputs.class }}
      toolingTests: ${{ steps.select.outputs.toolingTests }}
      verify: ${{ steps.select.outputs.verify }}
      matrix: ${{ steps.select.outputs.matrix }}
      dependencyReview: ${{ steps.select.outputs.dependencyReview }}
      clients: ${{ steps.select.outputs.clients }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            bun run script/ci-plan.ts --base "$BASE" --head "$HEAD" > ci-plan.json
          else
            bun run script/ci-plan.ts --full > ci-plan.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ci-plan
          path: ci-plan.json
          retention-days: 14
          if-no-files-found: warn

  prepare:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - run: bun run ci build
      - run: bun run ci pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workspace-dist
          path: workspace-dist.tar
          if-no-files-found: error
          retention-days: 14

  clients:
    name: Clients (Rust)
    needs: [plan]
    if: needs.plan.outputs.clients == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: clients
      - name: Prepare isolated X11 fixture
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb openbox libx11-6 libxi6 libxkbcommon0
      - run: bun run --cwd packages/protocol build
      - run: bun run script/generate-machine-schema.ts --check
      - run: bun run clients:lint
      - run: bun run clients:test
      - name: Permission hook module tests
        run: bun test ./script/conformance/agent/permission.spec.ts
      - run: bun run clients:conformance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-clients-conformance
          # Multi-path like the other coverage uploads so the patch gate keeps
          # the `script/coverage/` ancestor that names the lane prefix.
          path: |
            packages/*/coverage/
            script/coverage/
          if-no-files-found: warn
          retention-days: 14
      - name: Gate native line coverage (build.rs is not measured)
        run: cd clients && cargo llvm-cov --workspace --tests --locked --fail-under-lines 100

  desktop-smoke:
    name: Desktop production smoke
    needs: [plan, prepare]
    if: needs.plan.outputs.verify == 'true' && (contains(fromJSON(needs.plan.outputs.matrix).include.*.key, 'desktopApp') || contains(fromJSON(needs.plan.outputs.matrix).include.*.key, 'ui'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
      - id: electron-version
        shell: bash
        run: |
          version="$(cd apps/desktop && bun -e 'console.log(require("electron/package.json").version)')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron-version.outputs.version }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: workspace-dist
      - run: bun run ci restore
      - name: Install Electron binary
        env:
          electron_config_cache: /home/runner/.cache/electron
        run: |
          ELECTRON_DIR="$(cd apps/desktop && bun -e 'console.log(require("node:path").dirname(require.resolve("electron/package.json")))')"
          (cd "$ELECTRON_DIR" && node install.js)
      - name: Run Electron smoke
        working-directory: apps/desktop
        env:
          electron_config_cache: /home/runner/.cache/electron
        run: xvfb-run -a bun run test:e2e

  dependency-review:
    name: Dependency Review
    needs: [plan]
    if: github.event_name == 'pull_request' && needs.plan.outputs.dependencyReview == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  static:
    name: Static Analysis (${{ matrix.task }})
    needs: [plan, prepare]
    if: needs.plan.outputs.verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        task: [lint, check-types]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: workspace-dist
      - run: bun run ci restore
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-plan
      - if: matrix.task == 'check-types'
        run: bun run ci check-types --plan ci-plan.json
      - if: matrix.task == 'lint'
        run: |
          bun run lint:docs
          bunx ultracite@7.8.3 check --formatter-enabled=false .

  deps:
    name: Dependency Rules
    needs: [plan, prepare]
    if: needs.plan.outputs.verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: workspace-dist
      - run: bun run ci restore
      - run: bun run script/check-topology.ts
      - run: bun run script/check-deps.ts
      - run: bun run script/check-comment-residue.ts
      - run: bun run script/check-core-end-state.ts
      - run: bun run script/check-effect-boundaries.ts
      - run: bun run check-written-types
      - run: bun run lint:guards
      - run: bun run lint:side-effects
      - run: bun run lint:tools
      - run: bun run lint:tools --self-test
      - run: bun run script/check-dead-exports.ts
      - run: bun run script/check-journal-writers.ts
      - run: bun run script/check-import-cycles.ts
      - run: bun run script/verify-tsconfig-inheritance.ts

  tests:
    name: Test (${{ matrix.key }})
    needs: [plan, prepare]
    if: needs.plan.outputs.verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ startsWith(matrix.key, 'scripts-tooling-') && 15 || 30 }}
    env:
      ONI_CHILD_COVERAGE_DIR: ${{ github.workspace }}/apps/oni/coverage/children
    strategy:
      fail-fast: false
      # ci-plan derives scripts-tooling-1 and scripts-tooling-2 from scriptPartitions.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.dir == 'script'
        with:
          node-version: "24.19.0"
      - name: Pinned quality Python tools
        if: matrix.dir == 'script'
        run: |
          python -m pip install --requirement script/conformance/quality-python-requirements.txt
          echo "D945_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: workspace-dist
      - run: bun run ci restore
      - name: Machine client prerequisite
        if: matrix.key == 'machines' || matrix.key == 'codemode' || matrix.key == 'oniApp'
        uses: ./.github/actions/machine-client
      - name: Browser prerequisites (codemode, #1275)
        if: matrix.key == 'codemode'
        uses: ./.github/actions/browser-prerequisites
      - name: ffmpeg prerequisites (oni app media)
        if: matrix.key == 'oniApp'
        uses: ./.github/actions/ffmpeg-prerequisites
      # topology:test-steps:start — generated by script/topology.ts
      - name: Test (protocol)
        if: matrix.key == 'protocol'
        run: bun test --timeout 15000 --coverage --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: packages/protocol
      - name: Test (agent)
        if: matrix.key == 'agent'
        run: bun run test:ci
        working-directory: packages/agent
      - name: Test (llm)
        if: matrix.key == 'llm'
        run: bun test --timeout 15000 --coverage --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: packages/llm
      - name: Test (machines)
        if: matrix.key == 'machines'
        run: bun test --timeout 15000 --coverage --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: packages/machines
      - name: Test (codemode)
        if: matrix.key == 'codemode'
        run: bun test --timeout 15000 --coverage --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: packages/codemode
      - name: Test (sync)
        if: matrix.key == 'sync'
        run: bun test --timeout 15000 --coverage --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: packages/sync
      - name: Test (channels)
        if: matrix.key == 'channels'
        run: bun test --timeout 15000 --coverage --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: packages/channels
      - name: Test (oni app)
        if: matrix.key == 'oniApp'
        timeout-minutes: 10
        run: bun test --timeout 15000 --coverage --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: apps/oni
      - name: Test (ui design system)
        if: matrix.key == 'ui'
        run: bun test --timeout 15000 --coverage --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: packages/ui
      - name: Test (desktop app)
        if: matrix.key == 'desktopApp'
        run: bun test --timeout 15000 --coverage --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: apps/desktop
      # topology:test-steps:end
      - name: Tooling self-tests
        if: matrix.dir == 'script' && needs.plan.outputs.toolingTests == 'true'
        env:
          LANE: ${{ matrix.key }}
        run: bun run ci test --lane "$LANE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-${{ matrix.key }}
          path: |
            packages/*/coverage/
            apps/*/coverage/
            script/coverage/
          if-no-files-found: warn
          retention-days: 14

  scripts-contracts:
    name: Test (scripts-contracts)
    needs: [plan, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: workspace-dist
      - run: bun run ci restore
      - run: bun run ci test --lane scripts-contracts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-scripts-contracts
          # Same multi-path list as the matrix upload: a single path makes
          # upload-artifact flatten the tree, and the patch gate derives the
          # `script/` prefix from the preserved `script/coverage/` ancestor.
          path: |
            packages/*/coverage/
            apps/*/coverage/
            script/coverage/
          if-no-files-found: warn
          retention-days: 14

  patch-coverage:
    name: Patch Coverage
    needs: [plan, clients, tests, scripts-contracts]
    # Every changed executable line must be exercised by the PR's own test
    # evidence (#1116). Deep audits (mutation, census) run on the schedule in
    # quality-mutation.yml, not per PR.
    if: "!cancelled() && github.event_name == 'pull_request' && needs.plan.outputs.verify == 'true' && needs.tests.result == 'success' && needs.scripts-contracts.result == 'success' && (needs.clients.result == 'success' || needs.clients.result == 'skipped')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      # Each lane's artifact lands in its own subdirectory so identical
      # script/coverage/lcov.info paths from different shards never collide;
      # the checker unions DA records across every downloaded lcov file.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: coverage-artifacts
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bun run script/check-patch-coverage.ts --base "$BASE" --glob 'coverage-artifacts/**/lcov.info'

  ci:
    name: CI
    needs: [plan, prepare, clients, tests, scripts-contracts, static, deps, desktop-smoke, patch-coverage, dependency-review]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-plan
      - name: Verify Clients Rust completion
        env:
          CLIENTS_ENABLED: ${{ needs.plan.outputs.clients }}
          CLIENTS_RESULT: ${{ needs.clients.result }}
        run: |
          if [[ "$CLIENTS_ENABLED" == "true" ]]; then
            test "$CLIENTS_RESULT" = "success"
          else
            test "$CLIENTS_ENABLED" = "false"
            test "$CLIENTS_RESULT" = "skipped"
          fi
      - run: bun run ci gate --plan ci-plan.json
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_EVENT: ${{ github.event_name }}
