name: "\U0001F41B Bug Report"
description: Something is broken or not working as expected
labels: ["bug", "needs-triage"]
body:
  - type: checkboxes
    id: validations
    attributes:
      label: Pre-flight Checks
      options:
        - label: I searched existing issues and this hasn't been reported
          required: true
        - label: I'm using the latest version of the affected package
          required: true
        - label: This is a bug, not a usage question (use [Discussions](https://github.com/INONONO66/oni/discussions) for questions)
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I call X with Y, it does Z instead of W."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction
      description: |
        Please provide a minimal code snippet or steps that reliably reproduce the issue.
        Issues without reproduction steps may be closed without investigation.
      placeholder: |
        ```ts
        import { Storage } from "@oni/agent";
        Storage.get(); // Expected: returns adapter, Actual: throws
        ```

        Or steps:
        1. Run `bun test` in packages/ledger
        2. See error in test X
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error Message & Stack Trace
      description: Paste the full error output if applicable.
      render: shell
    validations:
      required: false

  - type: dropdown
    id: package
    attributes:
      label: Affected Package
      description: Which package(s) are affected?
      multiple: true
      options:
        - protocol
        - session
        - llm
        - agent
        - oni
        - coordinator
        - server
        - Not sure
    validations:
      required: true

  - type: textarea
    id: system-info
    attributes:
      label: System Info
      description: |
        Run this and paste the output:
        ```bash
        echo "Bun: $(bun --version)" && echo "Node: $(node --version)" && echo "OS: $(uname -srm)"
        ```
      render: shell
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Relevant config, screenshots, related ADRs or golden principles.
    validations:
      required: false
