name: "\U0001F680 Feature Request"
description: Suggest a new capability or enhancement
labels: ["feature-request", "needs-triage"]
body:
  - type: checkboxes
    id: validations
    attributes:
      label: Pre-flight Checks
      options:
        - label: I searched existing issues and feature requests
          required: true
        - label: This aligns with Oni's design goals (orchestration, multi-agent, LLM-first)
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What's missing or painful today?
      placeholder: "I'm trying to do X but there's no way to Y without Z workaround."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work? Be specific about API shape, behavior, and usage.
      placeholder: |
        Add `Bus.subscribeOnce(event, handler)` that auto-unsubscribes after first match.

        ```ts
        Bus.subscribeOnce(MyEvent, (data) => {
          // fires once, then unsubscribes
        });
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider? Why were they insufficient?
    validations:
      required: false

  - type: dropdown
    id: package
    attributes:
      label: Affected Package
      description: Which package(s) would this change?
      multiple: true
      options:
        - protocol
        - session
        - llm
        - agent
        - oni
        - coordinator
        - server
        - New package
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: breaking
    attributes:
      label: Breaking Change?
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Use cases, examples from other projects, mockups, or related issues.
    validations:
      required: false
