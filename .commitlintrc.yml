extends:
  - "@commitlint/config-conventional"
rules:
  type-enum:
    - 2
    - always
    - [feat, fix, refactor, test, docs, chore, perf]
  scope-enum:
    - 1
    - always
    - [protocol, ipc, telemetry, ledger, policy, placement, llm, agent, machines, channels, oni, script, docs]
  header-max-length:
    - 2
    - always
    - 72
