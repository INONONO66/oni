name: Browser prerequisites
description: Install playwright with Chromium and start the Xvfb display the codemode browser recipe tests need (#1275)
runs:
  using: composite
  steps:
    - run: |
        python -m pip install playwright==1.63.0
        python -m playwright install --with-deps chromium
        # Ubuntu 24.04 runners restrict unprivileged user namespaces, which
        # Chromium's sandbox needs ("No usable sandbox", exit 133). Relax the
        # runner, not the product: no --no-sandbox in the launch line.
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        sudo apt-get update
        sudo apt-get install -y xvfb
        Xvfb :99 -screen 0 1280x800x24 &
        echo "DISPLAY=:99" >> "$GITHUB_ENV"
      shell: bash
