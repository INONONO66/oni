[package]
name = "oni-machine-client"
description = "The mclient binary: joins a machine to an oni host."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "mclient"
path = "src/main.rs"

[dependencies]
clap.workspace = true
oni-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time", "process", "signal"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
thiserror = "2"
x509-parser = "0.18"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
nix = { version = "0.29", features = ["signal", "process", "hostname", "user"] }
rustix = { version = "1", features = ["fs"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
time = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Live screen stream (#1662), pinned 2026-10-25: str0m is a sans-I/O WebRTC
# stack driven from the client's own tokio loop with an injected clock (pure
# Rust DTLS/SRTP via rust-crypto); openh264 is built from its bundled source
# so Linux headless and macOS share one H.264 encoder.
str0m = { version = "=0.24.1", default-features = false, features = ["rust-crypto"] }
openh264 = { version = "=0.9.9", default-features = false, features = ["source"] }
# WebSocket upgrade accept key of the CDP tunnel (#1662).
sha1 = "0.10"


[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
# Screen capture backend (#1662): macOS only; on Linux it needs pipewire,
# libclang and xcb, so Linux builds use no native capture backend.
xcap = { version = "=0.9.8", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
# Input injection (#1662), pinned 2026-10-25: macOS posts CGEvents behind the
# Accessibility grant; Linux uses the pure-Rust X11 (XTEST) connection only.
enigo = { version = "=0.6.1", default-features = false, features = ["x11rb"] }
