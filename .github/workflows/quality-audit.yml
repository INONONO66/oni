name: Quality Audit

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

# Never a PR gate or a required check. Serialize issue updates across refs.
concurrency:
  group: quality-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - id: plan
        run: echo "matrix=$(bun run script/quality-audit.ts --matrix)" >> "$GITHUB_OUTPUT"
      - run: bun run ci build
      - run: bun run ci pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workspace-dist
          path: workspace-dist.tar
          if-no-files-found: error
          retention-days: 14

  coverage:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.3.0
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - if: matrix.dir == 'script'
        run: |
          python -m pip install --requirement script/conformance/quality-python-requirements.txt
          echo "D945_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: workspace-dist
      - run: bun run ci restore
      - name: Browser prerequisites (codemode, #1275)
        if: matrix.key == 'codemode'
        uses: ./.github/actions/browser-prerequisites
      - name: ffmpeg prerequisites (oni app media)
        if: matrix.key == 'oniApp'
        uses: ./.github/actions/ffmpeg-prerequisites
      - name: Same test command and coverage as CI
        env:
          LANE: ${{ matrix.key }}
        run: bun run ci test --lane "$LANE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.coverage
        with:
          name: coverage-${{ matrix.key }}
          path: ${{ matrix.dir }}/coverage/lcov.info
          if-no-files-found: error
          retention-days: 30

  audit:
    needs: [prepare, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: workspace-dist
      - run: bun run ci restore
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: quality-audit-input
      - name: Measure and upsert debt issues (mutation runs separately)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run script/quality-audit.ts --publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: quality-audit
          path: |
            quality-audit.json
            quality-audit-input/
          if-no-files-found: error
          retention-days: 30
