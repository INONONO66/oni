[package]
name = "oni-machine-client"
description = "The mclient binary: joins a machine to an oni host."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "mclient"
path = "src/main.rs"

[dependencies]
clap.workspace = true
oni-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time", "process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
thiserror = "2"
x509-parser = "0.18"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
nix = { version = "0.29", features = ["signal", "process", "hostname"] }
rustix = { version = "1", features = ["fs"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
time = "0.3"


[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tempfile = "3"
